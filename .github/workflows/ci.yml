name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: analysis/requirements*.txt
      - run: pip install -r analysis/requirements-dev.txt
      - run: pytest

  firmware-build:
    name: Firmware build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [csi_send, csi_recv]
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32c6
          path: firmware/${{ matrix.app }}
